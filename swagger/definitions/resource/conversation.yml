type: object
properties:
  id:
    type: number
    description: ID da conversa
  messages:
    type: array
    items:
      $ref: '#/definitions/message'
  account_id:
    type: number
    description: ID da Conta
  inbox_id:
    type: number
    description: ID da caixa de entrada
  status:
    type: string
    enum: ['open', 'resolved', 'pending']
    description: O status da conversa
  timestamp:
    type: string
    description: O horário em que a conversa foi criada
  contact_last_seen_at:
    type: string
  agent_last_seen_at:
    type: string
  unread_count:
    type: number
    description: O número de mensagens não lidas
  additional_attributes:
    type: object
    description: O objeto contendo atributos adicionais relacionados à conversa
  custom_attributes:
    type: object
    description: O objeto para salvar atributos personalizados para a conversa, aceita chave e valor de atributos personalizados
    example: { attribute_key: attribute_value, priority_conversation_number: 3 }
