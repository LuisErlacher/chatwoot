type: object
properties:
  payload:
    type: object
    properties:
      contact:
        type: object
        properties:
          email:
            type: string
            description: Endereço de e-mail do contato
          name:
            type: string
            description: O nome do contato
          phone_number:
            type: string
            description: Número de telefone do contato
          thumbnail:
            type: string
            description: URL do avatar do contato
          additional_attributes:
            type: object
            description: O objeto contendo atributos adicionais relacionados ao contato
          custom_attributes:
            type: object
            description: O objeto para salvar atributos personalizados para o contato, aceita chave e valor de atributos personalizados
            example: { attribute_key: attribute_value, signed_up_at: dd/mm/yyyy }
          contact_inboxes:
            type: array
            items:
              $ref: '#/definitions/contact_inboxes'
